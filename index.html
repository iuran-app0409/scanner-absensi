<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Absensi Sekolah</title>


  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f4f7fb;

      color: #1f2937;

    }


    .container {

      max-width: 600px;

      margin: auto;

    }


    .header {

      background: #1f4e78;

      color: white;

      padding: 25px;

      border-radius: 20px;

      text-align: center;

      margin-bottom: 20px;

    }


    .header h1 {

      margin: 0 0 8px;

      font-size: 28px;

    }


    .header p {

      margin: 0;

      font-size: 18px;

    }


    .card {

      background: white;

      padding: 25px;

      border-radius: 20px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.10);

    }


    .pilihan {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 12px;

      margin-top: 20px;

    }


    .jenis {

      border: none;

      border-radius: 15px;

      padding: 20px 10px;

      font-size: 18px;

      font-weight: bold;

      color: white;

      cursor: pointer;

    }


    .masuk {

      background: #16a34a;

    }


    .pulang {

      background: #2563eb;

    }


    .lembur {

      background: #ea580c;

    }


    .jenis.aktif {

      outline:
        5px solid
        rgba(0,0,0,.15);

      transform: scale(1.02);

    }


    #scannerArea {

      display: none;

      margin-top: 25px;

    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 15px;

    }


    .pilihanAktif {

      padding: 15px;

      border-radius: 12px;

      text-align: center;

      background: #eff6ff;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    button.control {

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 17px;

      margin-top: 15px;

      font-size: 19px;

      font-weight: bold;

      cursor: pointer;

    }


    #mulai {

      background: #1f4e78;

      color: white;

    }


    #stop {

      background: #dc2626;

      color: white;

    }


    #status {

      text-align: center;

      margin-top: 18px;

      font-size: 17px;

      font-weight: bold;

    }


    #hasil {

      display: none;

      margin-top: 20px;

      padding: 20px;

      border-radius: 15px;

      background: #ecfdf5;

      text-align: center;

    }


    #token {

      margin-top: 12px;

      font-weight: bold;

      word-break: break-all;

    }


    @media(max-width:480px) {

      .pilihan {

        grid-template-columns: 1fr;

      }

    }

  </style>

</head>


<body>

<div class="container">


  <div class="header">

    <h1>
      📷 ABSENSI SEKOLAH
    </h1>

    <p>
      Pilih jenis absensi terlebih dahulu
    </p>

  </div>


  <div class="card">


    <!-- =========================================
         PILIH JENIS
    ========================================== -->

    <div id="pilihanArea">

      <div style="
        text-align:center;
        font-size:20px;
        font-weight:bold;
      ">

        Pilih Jenis Absensi

      </div>


      <div class="pilihan">


        <button
          class="jenis masuk"
          onclick="pilihJenis('MASUK', this)">

          🟢<br>
          MASUK

        </button>


        <button
          class="jenis pulang"
          onclick="pilihJenis('PULANG', this)">

          🔵<br>
          PULANG

        </button>


        <button
          class="jenis lembur"
          onclick="pilihJenis('LEMBUR', this)">

          🟠<br>
          LEMBUR

        </button>


      </div>

    </div>


    <!-- =========================================
         SCANNER
    ========================================== -->

    <div id="scannerArea">


      <div
        class="pilihanAktif"
        id="jenisAktif">

      </div>


      <div id="reader"></div>


      <button
        id="mulai"
        class="control"
        onclick="mulaiScan()">

        📷 MULAI SCAN

      </button>


      <button
        id="stop"
        class="control"
        onclick="stopScan()"
        disabled>

        ⏹ STOP SCAN

      </button>


      <div id="status">

        Scanner belum dimulai

      </div>


      <div id="hasil">

        <div
          style="
            font-size:20px;
            font-weight:bold;
          ">

          ✅ QR BERHASIL TERBACA

        </div>


        <div id="token"></div>


        <div style="margin-top:15px;">

          ⏳ Membuka sistem absensi...

        </div>

      </div>


    </div>


  </div>

</div>


<script>


let scanner = null;

let sedangScan = false;

let sudahTerbaca = false;

let jenisDipilih = '';


// ==================================================
// APPS SCRIPT
// ==================================================

const APP_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby3FJoTXXj2xpUKoMEZexhf-lqpXUd7H-ovD6WSlu2q4vBinA0L-3lztOIvKOuSDDzZ/exec";


// ==================================================
// PILIH JENIS
// ==================================================

function pilihJenis(
  jenis,
  tombol
) {

  jenisDipilih =
    String(jenis)
      .trim()
      .toUpperCase();


  // aktifkan visual tombol

  document.querySelectorAll(
    '.jenis'
  ).forEach(
    function(btn) {

      btn.classList.remove(
        'aktif'
      );

    }
  );


  tombol.classList.add(
    'aktif'
  );


  let teks = '';


  if (
    jenisDipilih === 'MASUK'
  ) {

    teks =
      '🟢 MODE: MASUK';

  }

  else if (
    jenisDipilih === 'PULANG'
  ) {

    teks =
      '🔵 MODE: PULANG';

  }

  else if (
    jenisDipilih === 'LEMBUR'
  ) {

    teks =
      '🟠 MODE: LEMBUR';

  }


  document.getElementById(
    'jenisAktif'
  ).innerText =
    teks;


  document.getElementById(
    'scannerArea'
  ).style.display =
    'block';


  document.getElementById(
    'status'
  ).innerText =
    'Tekan MULAI SCAN untuk membuka kamera.';


  // scroll otomatis

  document.getElementById(
    'scannerArea'
  ).scrollIntoView({
    behavior: 'smooth'
  });

}


// ==================================================
// MULAI SCAN
// ==================================================

async function mulaiScan() {

  if (
    !jenisDipilih
  ) {

    alert(
      'Pilih jenis absensi terlebih dahulu.'
    );

    return;

  }


  if (sedangScan) {
    return;
  }


  sudahTerbaca = false;


  document.getElementById(
    'hasil'
  ).style.display =
    'none';


  document.getElementById(
    'status'
  ).innerText =
    '⏳ Memulai kamera...';


  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    const config = {

      fps: 10,

      qrbox:
        function(width, height) {

          const ukuran =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );


          return {

            width: ukuran,

            height: ukuran

          };

        }

    };


    await scanner.start(

      {
        facingMode:
          'environment'
      },

      config,

      ketikaQRTerbaca,

      function(errorMessage) {

        // tetap mencari QR

      }

    );


    sedangScan = true;


    document.getElementById(
      'mulai'
    ).disabled = true;


    document.getElementById(
      'stop'
    ).disabled = false;


    document.getElementById(
      'status'
    ).innerText =
      '🟢 Kamera aktif — arahkan ke QR';


  }


  catch(error) {

    console.error(error);


    document.getElementById(
      'status'
    ).innerText =
      '❌ Kamera gagal dibuka';


    alert(
      'KAMERA GAGAL DIBUKA.\n\n' +
      error
    );


    scanner = null;

    sedangScan = false;

  }

}


// ==================================================
// QR TERBACA
// ==================================================

async function ketikaQRTerbaca(
  decodedText
) {

  if (sudahTerbaca) {
    return;
  }


  sudahTerbaca = true;


  const isiQR =
    String(
      decodedText || ''
    ).trim();


  document.getElementById(
    'token'
  ).innerText =
    isiQR;


  document.getElementById(
    'hasil'
  ).style.display =
    'block';


  document.getElementById(
    'status'
  ).innerText =
    '✅ QR berhasil dibaca!';


  await stopScan();


  // ==================================================
  // AMBIL TOKEN
  // ==================================================

  let token = isiQR;


  /*
   * Kalau QR berisi URL Apps Script,
   * ambil token dari parameter t
   * atau token.
   */

  if (
    isiQR.startsWith(
      'https://script.google.com/'
    )
  ) {

    try {

      const qrUrl =
        new URL(
          isiQR
        );


      token =
        qrUrl.searchParams.get(
          't'
        ) ||

        qrUrl.searchParams.get(
          'token'
        ) ||

        '';


    }

    catch(error) {

      console.error(error);

    }

  }


  token =
    String(
      token || ''
    ).trim();


  if (!token) {

    document.getElementById(
      'status'
    ).innerText =
      '❌ Token QR tidak ditemukan.';

    return;

  }


  // ==================================================
  // BUAT URL APPS SCRIPT
  // ==================================================

  const tujuan =
    APP_SCRIPT_URL +
    '?t=' +
    encodeURIComponent(
      token
    ) +
    '&jenis=' +
    encodeURIComponent(
      jenisDipilih
    );


  console.log(
    'MENUJU:',
    tujuan
  );


  document.getElementById(
    'status'
  ).innerText =
    '⏳ Mengirim absensi ' +
    jenisDipilih +
    '...';


  setTimeout(
    function() {

      window.location.href =
        tujuan;

    },
    800
  );

}


// ==================================================
// STOP SCAN
// ==================================================

async function stopScan() {

  if (!scanner) {
    return;
  }


  try {

    if (sedangScan) {

      await scanner.stop();

    }


    scanner.clear();

  }

  catch(error) {

    console.error(error);

  }


  scanner = null;

  sedangScan = false;


  document.getElementById(
    'mulai'
  ).disabled = false;


  document.getElementById(
    'stop'
  ).disabled = true;

}

</script>

</body>

</html>
