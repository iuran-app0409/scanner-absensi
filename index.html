<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Scanner QR Absensi</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .header {
      background: #1f4e78;
      color: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      font-size: 18px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.10);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px;
      margin-top: 18px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #mulai {
      background: #1f4e78;
      color: white;
    }

    #stop {
      background: #dc2626;
      color: white;
    }

    #stop:disabled {
      opacity: .5;
    }

    #status {
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    #hasil {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 16px;
      background: #ecfdf5;
      text-align: center;
    }

    .judul {
      font-size: 20px;
      font-weight: bold;
    }

    #token {
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📷 SCANNER QR ABSENSI</h1>
    <p>Scan QR Code siswa atau guru</p>
  </div>

  <div class="card">

    <div id="reader"></div>

    <button id="mulai"
            onclick="mulaiScan()">
      📷 MULAI SCAN
    </button>

    <button id="stop"
            onclick="stopScan()"
            disabled>
      ⏹ STOP SCAN
    </button>

    <div id="status">
      Scanner belum dimulai
    </div>

    <div id="hasil">

      <div class="judul">
        ✅ QR BERHASIL TERBACA
      </div>

      <div id="token"></div>

      <div style="margin-top:15px;">
        ⏳ Membuka sistem absensi...
      </div>

    </div>

  </div>

</div>


<script>

let scanner = null;
let sedangScan = false;
let sudahTerbaca = false;


/* =====================================
   MULAI SCAN
===================================== */

async function mulaiScan() {

  if (sedangScan) {
    return;
  }

  sudahTerbaca = false;

  document.getElementById("hasil").style.display =
    "none";

  document.getElementById("status").innerText =
    "⏳ Memulai kamera...";

  try {

    scanner = new Html5Qrcode("reader");

    const config = {

      fps: 10,

      qrbox: function(width, height) {

        const ukuran =
          Math.floor(Math.min(width, height) * 0.70);

        return {
          width: ukuran,
          height: ukuran
        };
      }

    };


    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      ketikaQRTerbaca,

      function(errorMessage) {
        // Scanner terus mencari QR
      }

    );


    sedangScan = true;

    document.getElementById("mulai").disabled =
      true;

    document.getElementById("stop").disabled =
      false;

    document.getElementById("status").innerText =
      "🟢 Kamera aktif — arahkan ke QR";


  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "❌ Kamera gagal dibuka";

    alert(
      "KAMERA GAGAL DIBUKA.\n\n" +
      error
    );

    scanner = null;
    sedangScan = false;

  }

}


/* =====================================
   QR TERBACA
===================================== */

async function ketikaQRTerbaca(decodedText) {

  if (sudahTerbaca) {
    return;
  }

  sudahTerbaca = true;

  console.log("QR TERBACA:", decodedText);

  document.getElementById("token").innerText =
    decodedText;

  document.getElementById("hasil").style.display =
    "block";

  document.getElementById("status").innerText =
    "✅ QR berhasil dibaca!";


  await stopScan();


  /*
   * QR harus berisi URL Apps Script.
   *
   * Contoh:
   *
   * https://script.google.com/macros/s/XXXX/exec?token=QR-STD-00001
   *
   * URL tersebut akan membuka Apps Script.
   *
   * Code.gs kemudian membaca token
   * dan menjalankan simpanAbsensi(token).
   */


  setTimeout(function() {

    const url =
      String(decodedText || "").trim();


    if (
      url.startsWith(
        "https://script.google.com/"
      )
    ) {

      document.getElementById("status").innerText =
        "⏳ Mengirim absensi...";

      window.location.href = url;

    } else {

      document.getElementById("status").innerText =
        "⚠️ QR bukan URL sistem absensi.";

      alert(
        "QR berhasil dibaca, tetapi isinya bukan URL Apps Script absensi.\n\n" +
        "Isi QR:\n" +
        url
      );

    }

  }, 500);

}


/* =====================================
   STOP SCAN
===================================== */

async function stopScan() {

  if (!scanner) {
    return;
  }

  try {

    if (sedangScan) {
      await scanner.stop();
    }

    scanner.clear();

  } catch (error) {

    console.error(error);

  }

  scanner = null;
  sedangScan = false;

  document.getElementById("mulai").disabled =
    false;

  document.getElementById("stop").disabled =
    true;

}

</script>

</body>
</html>
