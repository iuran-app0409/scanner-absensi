<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Scanner QR Absensi</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .container {
      max-width: 550px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #1f4e78;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.10);
    }

    .petunjuk {
      text-align: center;
      font-size: 18px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #1f4e78;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #stop {
      background: #dc2626;
    }

    #status {
      text-align: center;
      margin-top: 18px;
      font-size: 17px;
      font-weight: bold;
    }

    #hasil {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      background: #ecfdf5;
      text-align: center;
    }

    .token {
      margin-top: 12px;
      padding: 12px;
      background: white;
      border-radius: 10px;
      word-break: break-all;
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📷 SCANNER QR ABSENSI</h1>

  <div class="card">

    <div class="petunjuk">
      Arahkan kamera ke QR Code siswa atau guru.
    </div>

    <div id="reader"></div>

    <button id="mulai"
            onclick="mulaiScanner()">
      📷 MULAI SCAN
    </button>

    <button id="stop"
            onclick="hentikanScanner()">
      ⏹ STOP SCAN
    </button>

    <div id="status">
      Scanner belum dimulai
    </div>

    <div id="hasil">

      <div>
        ✅ QR BERHASIL TERBACA
      </div>

      <div class="token"
           id="token">
      </div>

      <div style="margin-top:15px;">
        ⏳ Membuka sistem absensi...
      </div>

    </div>

  </div>

</div>


<script>

let scanner = null;
let sedangScan = false;
let sudahTerbaca = false;


/* =========================================
   MULAI SCANNER
========================================= */

async function mulaiScanner() {

  if (sedangScan) {
    return;
  }

  sudahTerbaca = false;

  document.getElementById("hasil").style.display =
    "none";

  document.getElementById("status").innerText =
    "⏳ Meminta akses kamera...";


  try {

    scanner = new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: function(width, height) {

        const ukuran =
          Math.floor(Math.min(width, height) * 0.70);

        return {
          width: ukuran,
          height: ukuran
        };

      }

    };


    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      ketikaQRTerbaca,

      function(errorMessage) {
        // Scanner terus mencari QR
      }

    );


    sedangScan = true;


    document.getElementById("mulai").style.display =
      "none";


    document.getElementById("status").innerText =
      "🟢 Kamera aktif — arahkan ke QR";


  } catch (error) {

    console.error(error);


    document.getElementById("status").innerText =
      "❌ Kamera gagal dibuka";


    alert(
      "Kamera gagal dibuka.\n\n" +
      error
    );


    scanner = null;
    sedangScan = false;

  }

}


/* =========================================
   QR BERHASIL TERBACA
========================================= */

function ketikaQRTerbaca(decodedText) {

  if (sudahTerbaca) {
    return;
  }

  sudahTerbaca = true;


  console.log(
    "QR TERBACA:",
    decodedText
  );


  document.getElementById("token").innerText =
    decodedText;


  document.getElementById("hasil").style.display =
    "block";


  document.getElementById("status").innerText =
    "✅ QR berhasil dibaca!";


  /*
    Hentikan kamera
  */

  hentikanScanner();


  /*
    QR kita berisi URL Apps Script.
    
    Contoh:

    https://script.google.com/macros/s/XXXX/exec
    ?token=QR-STD-00001

    Kita langsung membuka URL tersebut.

    Code.gs yang baru akan membaca:
    
    e.parameter.token

    kemudian menjalankan:

    simpanAbsensi(token)
  */


  setTimeout(function() {

    if (
      decodedText.startsWith(
        "https://script.google.com/"
      )
    ) {

      window.location.href =
        decodedText;

    } else {

      alert(
        "QR terbaca, tetapi QR tersebut bukan URL sistem absensi."
      );

    }

  }, 700);

}


/* =========================================
   STOP SCANNER
========================================= */

async function hentikanScanner() {

  if (!scanner || !sedangScan) {
    return;
  }


  try {

    await scanner.stop();

    scanner.clear();

  } catch (error) {

    console.error(error);

  }


  scanner = null;

  sedangScan = false;


  document.getElementById("mulai").style.display =
    "block";

}

</script>

</body>

</html>
